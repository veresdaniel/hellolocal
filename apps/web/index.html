<!doctype html>
<html lang="hu">
  <head>
    <script>
      // CRITICAL: This must run IMMEDIATELY, before any other scripts
      // Suppress "tabReply will be removed" deprecation warning from browser extensions
      (function() {
        'use strict';
        if (typeof console === 'undefined') return;
        
        const filterTabReply = function(...args) {
          const message = String(args.join(' '));
          return message.includes('tabReply') || message.includes('tabReply will be removed');
        };
        
        // Intercept all console methods that might log the warning
        const methods = ['warn', 'error', 'log', 'info'];
        methods.forEach(method => {
          if (console[method]) {
            const original = console[method];
            console[method] = function(...args) {
              if (filterTabReply(...args)) {
                return; // Suppress tabReply warnings
              }
              original.apply(console, args);
            };
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <script>
      // Boot surface before CSS: public navy vs admin light (avoids wrong-color flash).
      (function () {
        var path = location.pathname || "/";
        var admin =
          /\/admin(\/|$)/.test(path) ||
          /\/(login|register|forgot-password|reset-password)\/?$/.test(path);
        document.documentElement.classList.add("hl-booting", admin ? "hl-boot-admin" : "hl-boot-public");
      })();
    </script>
    <style id="hl-first-paint">
      /* Match DEFAULT_PUBLIC_THEME_COLORS / admin surfaces — before the main CSS bundle. */
      :root {
        --hl-bg: #1b1730;
        --hl-on-dark: #f2f4fb;
      }
      html.hl-boot-public {
        background-color: var(--hl-bg);
        color: var(--hl-on-dark);
      }
      html.hl-boot-public body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--hl-bg);
        color: var(--hl-on-dark);
      }
      html.hl-boot-admin {
        background-color: #f8fafc;
        color: #1b1730;
      }
      html.hl-boot-admin body {
        margin: 0;
        min-height: 100vh;
        background-color: #f8fafc;
        color: #1b1730;
      }
      /* Hide empty SPA shell until entry CSS applies. SSR bodies (.hl-public) stay visible with shell CSS. */
      html.hl-booting #root:not(.hl-public) {
        visibility: hidden;
      }
    </style>

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Public default is self-hosted Source Sans 3. Inter/Poppins (admin + optional brand) load async. -->
    <link rel="preload" href="/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-sans-3-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!-- dns-prefetch early; CORS preconnect after first paint via SPA (avoids unused crossorigin hint). -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
